repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (auto-fix)
        entry: ruff check --fix src/
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format src/
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest
        entry: pytest tests/ -q --tb=short
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
