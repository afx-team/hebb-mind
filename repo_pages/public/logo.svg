<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="fg" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>
  <!-- Connections: outer nodes to center -->
  <line x1="9" y1="12" x2="16" y2="14" stroke="url(#fg)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="12" x2="16" y2="14" stroke="url(#fg)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="6" x2="16" y2="14" stroke="url(#fg)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Central axon trunk: center node straight down -->
  <line x1="16" y1="17.5" x2="16" y2="28" stroke="url(#fg)" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
  <!-- Axon branches: left pair, branching from trunk -->
  <line x1="16" y1="20" x2="11" y2="25" stroke="url(#fg)" stroke-width="1.1" stroke-linecap="round" opacity="0.45"/>
  <line x1="16" y1="23" x2="12" y2="28" stroke="url(#fg)" stroke-width="1.1" stroke-linecap="round" opacity="0.35"/>
  <!-- Axon branches: right pair, branching from trunk -->
  <line x1="16" y1="20" x2="21" y2="25" stroke="url(#fg)" stroke-width="1.1" stroke-linecap="round" opacity="0.45"/>
  <line x1="16" y1="23" x2="20" y2="28" stroke="url(#fg)" stroke-width="1.1" stroke-linecap="round" opacity="0.35"/>
  <!-- Outer nodes: left, top, right -->
  <circle cx="9" cy="12" r="3" fill="url(#fg)" opacity="0.85"/>
  <circle cx="23" cy="12" r="3" fill="url(#fg)" opacity="0.85"/>
  <circle cx="16" cy="6" r="3" fill="url(#fg)" opacity="0.85"/>
  <!-- Center node (hippocampus) -->
  <circle cx="16" cy="14" r="3.5" fill="#bc8cff"/>
</svg>
