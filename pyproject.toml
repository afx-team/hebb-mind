[project]
name = "afx-hippocampus"
version = "0.1.1"
description = "Neuroscience-inspired memory framework for AI agents / 海马体 — Agent 大脑记忆框架"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "afx-team", email = "afx-team@users.noreply.github.com" },
]
keywords = ["agent", "memory", "llm", "ai", "hippocampus", "rag", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "litellm>=1.40.0",
    "pydantic>=2.0.0",
    "sqlite-vec>=0.1.0",
    "pysqlite3>=0.5.0; sys_platform == 'darwin'",
    "aiosqlite>=0.20.0",
    "numpy>=1.24.0",
    "sentence-transformers>=3.0.0",
    "apscheduler>=3.10.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "networkx>=3.1",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
pg = [
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "datasets>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
hippocampus = "hippocampus.cli.main:main"
hippocampus-mcp = "hippocampus.mcp.server:main"

[project.urls]
Homepage = "https://github.com/afx-team/hippocampus"
Repository = "https://github.com/afx-team/hippocampus"
Documentation = "https://github.com/afx-team/hippocampus#readme"
Issues = "https://github.com/afx-team/hippocampus/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
