name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'repo_pages/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          # Full history so VitePress can read each page's git mtime for the
          # sitemap <lastmod> / "Last updated" freshness signal (a shallow
          # clone yields missing/garbage timestamps).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: repo_pages/package-lock.json

      - name: Install and build
        run: cd repo_pages && npm ci && npm run docs:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: repo_pages/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
