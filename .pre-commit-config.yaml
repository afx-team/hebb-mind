repos:
  - repo: local
    hooks:
      # ---- pre-commit (fast, auto-fix) ----
      - id: ruff-check
        name: ruff check (auto-fix)
        entry: ruff check --fix src/
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format src/
        language: system
        pass_filenames: false
        types: [python]

      # ---- pre-push (slow, verify; mirrors CI) ----
      - id: mypy
        name: mypy (type check)
        entry: mypy src/hebb/
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: pytest tests/ -q --tb=short
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
